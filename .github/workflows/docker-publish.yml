name: Build and Publish Docker Image to GHCR

on:
  push:
    branches: [ "main", "master" ]   # 推送到主分支时触发
    tags: [ "v*" ]                   # 打 tag 时也触发（推荐）
  pull_request:
    branches: [ "main", "master" ]   # PR 时只构建不推送

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # 自动变成 owner/repo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # 推送到 GHCR 必须
      id-token: write          # 如果要用 OIDC 签名可加

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 登录 GHCR
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 提取元数据（tag、label）
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') || github.ref == format('refs/heads/{0}', 'master') }}

      # 构建并推送
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile          # 如有多阶段或指定路径可改
          push: ${{ github.event_name != 'pull_request' }}   # PR 只构建不推
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 可选：开启缓存加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
